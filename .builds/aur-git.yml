# Publishes the development AUR package when a push to main changes its
# packaging. builds.sr.ht has no branch or path filter, so the first task ends
# the build otherwise.
image: archlinux
packages:
  - jq
  - openssh
  - rust
sources:
  - https://git.sr.ht/~rahmerh/sax
secrets:
  - 32053845-4007-472a-a57e-c59ea2fd3a32 # ~/.ssh/aur
tasks:
  - packaging-changed: |
      cd sax
      if [ "${GIT_REF:-}" != "refs/heads/main" ]; then
        echo "Not main (${GIT_REF:-none}), nothing to publish"; complete-build
      fi
      if git diff --quiet HEAD~1 HEAD -- packaging/aur/sax-git .builds/aur-git.yml; then
        echo "sax-git packaging unchanged, nothing to publish"; complete-build
      fi
  - configure-aur: |
      ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
      cat >> ~/.ssh/config <<'EOF'
      Host aur.archlinux.org
        User aur
        IdentityFile ~/.ssh/aur
        IdentitiesOnly yes
      EOF
  - publish-aur: |
      cd sax
      cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      pkgver="${cargo_version}.r$(git rev-list --count HEAD).g$(git rev-parse --short=7 HEAD)"
      cd ..

      git clone ssh://aur@aur.archlinux.org/sax-git.git aur-repo
      cp sax/packaging/aur/sax-git/PKGBUILD aur-repo/PKGBUILD
      sed -i "s/^pkgver=.*/pkgver=$pkgver/" aur-repo/PKGBUILD

      cd aur-repo
      makepkg --printsrcinfo > .SRCINFO
      git config user.name "rahmerh"
      git config user.email "basbouwhuis@protonmail.com"
      git add PKGBUILD .SRCINFO

      if git diff --cached --quiet; then
        echo "AUR package is already up to date."
        exit 0
      fi

      git commit -m "Update sax-git packaging"
      git push
