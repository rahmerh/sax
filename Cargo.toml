[package]
name = "sax"
version = "1.0.0"
edition = "2024"
description = "A simple but smart archiving and extraction tool."
license = "MIT"
repository = "https://github.com/rahmerh/sax"
readme = "README.md"

[dependencies]
anyhow = "1"
bzip2 = "0.6.1"
clap = { version = "4", features = ["derive"] }
color-print = "0.3.7"
dialoguer = "0.12.0"
flate2 = "1.1.9"
itertools = "0.14.0"
indicatif = "0.18.3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sevenz-rust = "0.6.1"
tar = "0.4.46"
thiserror = "2"
unrar-ng = "0.7"
xz2 = "0.1.7"
zip = "7.2.0"
zstd = "0.13.3"

[dev-dependencies]
kernal = "0.5.1"
mockall = "0.13.1"
sha1 = "0.10.6"
tempfile = "3.27.0"
